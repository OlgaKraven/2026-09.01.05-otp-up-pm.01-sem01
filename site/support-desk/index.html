<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Учебная служба поддержки</title><link rel="stylesheet" href="style.css"></head><body>
<header><p>Учебная практика · ПМ.01</p><h1>Служба технической поддержки</h1><p id="subject">Начало работы</p></header>
<div class="toolbar"><label>Загрузить исходные обращения<input id="file" type="file" accept=".json"></label><label>Восстановить выполненную работу<input id="restore" type="file" accept=".json"></label><button id="backup">Экспорт резервной копии</button><label>Код работы<input id="workcode" placeholder="Код, назначенный преподавателем" maxlength="40"></label></div>
<p id="message" role="status" aria-live="polite"></p><nav aria-label="Разделы работы"><button data-tab="tickets">Обращения</button><button data-tab="cards">Технологические карты</button><button data-tab="materials">Данные стенда</button><button data-tab="documents">Документы для сдачи</button></nav>
<main><aside><label>Поиск по обращениям<input id="search" type="search"></label><div id="list"></div></aside><section id="card"></section></main><script src="stand.js"></script><script src="docx.js"></script><script src="app.js"></script></body></html>
