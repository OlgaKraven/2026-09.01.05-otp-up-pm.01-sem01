<!doctype html><html lang="ru"><meta charset="utf-8"><title>Проверка CSV</title><style>body{font:18px/1.6 Arial;max-width:1000px;margin:30px auto;padding:20px}label{display:block;margin:15px}td,th{border:1px solid #999;padding:15px}table{border-collapse:collapse}pre{background:#f4f4f6;padding:20px}</style><h1>Проверка CSV своей области</h1><p>Выбрать sample.csv этого комплекта. Исходный файл не изменяется.</p><label>Файл CSV <input id="file" type="file" accept=".csv"></label><label>Кодировка <select id="encoding"><option value="utf-8">UTF-8</option><option value="windows-1251">Windows-1251</option></select></label><label>Разделитель <select id="delimiter"><option value=",">Запятая</option><option value=";">Точка с запятой</option></select></label><label>Тип первого столбца <select id="type"><option value="number">Число</option><option value="text">Текст</option></select></label><h2>Исходный текст</h2><pre id="source"></pre><h2>Результат чтения</h2><div id="result"></div><p id="status" role="status"></p><script>
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));let bytes;
function parse(s,del){let rows=[],row=[],v='',quoted=false;for(let i=0;i<s.length;i++){let c=s[i];if(c==='"'){if(quoted&&s[i+1]==='"'){v+='"';i++}else quoted=!quoted}else if(!quoted&&c===del){row.push(v);v=''}else if(!quoted&&c==='\n'){row.push(v.replace(/\r$/,''));rows.push(row);row=[];v=''}else v+=c}if(v||row.length){row.push(v);rows.push(row)}return rows}
function render(){if(!bytes)return;const text=new TextDecoder($('#encoding').value).decode(bytes);$('#source').textContent=text;const rows=parse(text,$('#delimiter').value);$('#result').innerHTML='<table>'+rows.map((r,i)=>'<tr>'+r.map((v,j)=>{if(i&&j===0&&$('#type').value==='number'&&/^\d+$/.test(v))v=String(Number(v));return '<'+(i?'td':'th')+'>'+esc(v)+'</'+(i?'td':'th')+'>'}).join('')+'</tr>').join('')+'</table>';$('#status').textContent='Строк данных: '+(rows.length-1)+'; столбцов в заголовке: '+rows[0].length}
$('#file').onchange=async e=>{bytes=await e.target.files[0].arrayBuffer();render()};for(const id of ['encoding','delimiter','type'])$('#'+id).onchange=render;</script></html>
