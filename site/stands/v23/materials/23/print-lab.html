<!doctype html><html lang="ru"><meta charset="utf-8"><title>Проверка макета печати</title><style>@font-face{font-family:'Golos Text';src:url('../../fonts/GolosText.ttf');font-weight:100 900}body{font-family:'Golos Text',Arial,sans-serif!important;color:#1c1c1c}select,input,button{font:inherit;border:1px solid #dfe1e5;border-radius:8px;padding:9px 12px}h1{font-weight:700;letter-spacing:-.6px}table{border-collapse:collapse}td,th{border:0!important;border-bottom:1px solid #dfe1e5!important}pre{border-radius:14px}body{font:18px/1.5 Arial;margin:25px}#page{width:600px;height:430px;border:2px solid #333;overflow:hidden;background:#f4f4f6;margin:20px 0}#sheet{box-sizing:border-box;width:596px;height:425px;border:3px solid #ed131c;position:relative;transform-origin:top left;background:white;padding:35px}#bottom{position:absolute;bottom:10px;left:30px}select{font:inherit}</style><h1>Учебный макет сертификата</h1><p>Модель границы страницы показывает влияние масштаба. Она не подтверждает физическую печать.</p><label>Масштаб <select id="scale"><option value="1.1">110 %</option><option value="1">100 %</option></select></label><div id="page"><article id="sheet"><h2>СЕРТИФИКАТ</h2><p>Учебный курс технической поддержки</p><p>Контроль: четыре стороны рамки и нижняя строка.</p><p id="bottom">Нижняя строка · учебный образец</p></article></div><p id="result" role="status"></p><script>const s=document.querySelector('#scale');function render(){document.querySelector('#sheet').style.transform='scale('+s.value+')';document.querySelector('#result').textContent=Number(s.value)>1?'Часть рамки и нижняя строка выходят за границу страницы.':'Четыре стороны рамки и нижняя строка находятся внутри страницы.'}s.onchange=render;render()</script></html>
